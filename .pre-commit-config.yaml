# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
        types: [file]  # override `types: [json]`
        files: \.(json|ipynb)$
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88 # frozen: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/asottile/reorder-python-imports
    rev: 4690733311bbfba33558e4d50a7f0092c64d78d8  # frozen: v3.19.0
    hooks:
    -   id: reorder-python-imports
  - repo: https://github.com/pycqa/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e # frozen: 7.5.0
    hooks:
      - id: flake8
        language_version: python3
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd # v1.0.2
    hooks:
    - id: sphinx-lint
      types: [rst]
